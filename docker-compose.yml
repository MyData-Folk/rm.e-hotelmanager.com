# ============================================================
#  RM e-HotelManager — Local Development Stack
#  Usage : docker compose up --build
# ============================================================
services:

  # ──────────────────────────────────────────────────────────
  # PostgreSQL 17 Database
  # ──────────────────────────────────────────────────────────
  hotel-db:
    image: postgres:17-alpine
    container_name: hotel-db
    environment:
      POSTGRES_DB:       hoteldb
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - hotel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hoteldb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # Express + TypeScript API Backend
  # ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotel-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@hotel-db:5432/hoteldb
      ADMIN_API_KEY: dev-admin-key
      ENV:            development
      PORT:           "8000"
      # CORS — allow both local frontends during development
      USER_WEB_ORIGIN:  http://localhost:5174
      ADMIN_WEB_ORIGIN: http://localhost:5173
      DEFAULT_RATE_SOURCE_MODE: hybrid
    ports:
      - "8000:8000"
    depends_on:
      hotel-db:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # Admin Web UI  (React 19 + Vite + Tailwind v4 + Nginx)
  # ──────────────────────────────────────────────────────────
  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: hotel-admin-web
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # User Web UI  (React + Vite + Nginx)
  # ──────────────────────────────────────────────────────────
  user-web:
    build:
      context: ./apps/user-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: hotel-user-web
    ports:
      - "8081:8080"
    depends_on:
      - backend
    restart: unless-stopped

# ──────────────────────────────────────────────────────────
# Named Volumes
# ──────────────────────────────────────────────────────────
volumes:
  hotel-db-data:
