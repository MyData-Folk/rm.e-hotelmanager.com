# ============================================================
#  RM e-HotelManager — Production Stack
#  Deployed via Coolify (Traefik is managed externally by Coolify).
#
#  Usage:
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
#  Prerequisites:
#    The "coolify" Docker network must already exist (managed by Coolify).
#    Coolify's built-in Traefik handles SSL and HTTP->HTTPS redirects.
# ============================================================

services:

  # ──────────────────────────────────────────────────────────
  # Express + TypeScript API Backend
  # Domains: back-rm.e-hotelmanager.com | api.hotelmanager.fr
  # ──────────────────────────────────────────────────────────
  hotel-rm-backend:
    build:
      context: ./backend
    environment:
      # DATABASE_URL is optional — backend starts in-memory if not set
      DATABASE_URL: ${DATABASE_URL:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      ENV: production
      PORT: "8000"
      USER_WEB_ORIGIN: https://rm-front.e-hotelmanager.com
      ADMIN_WEB_ORIGIN: https://admin-rm.e-hotelmanager.com
      DEFAULT_RATE_SOURCE_MODE: ${DEFAULT_RATE_SOURCE_MODE:-hybrid}
    expose:
      - "8000"
    networks:
      - internal
      - coolify
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.hotel-backend.rule=Host(`back-rm.e-hotelmanager.com`) || Host(`api-rm.e-hotelmanager.com`) || Host(`api.hotelmanager.fr`)"
      - "traefik.http.routers.hotel-backend.entrypoints=https"
      - "traefik.http.routers.hotel-backend.tls=true"
      - "traefik.http.routers.hotel-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.hotel-backend.loadbalancer.server.port=8000"

  # ──────────────────────────────────────────────────────────
  # Admin Web UI
  # Domains: admin-rm.e-hotelmanager.com | admin.hotelmanager.fr
  # ──────────────────────────────────────────────────────────
  hotel-rm-admin-web:
    build:
      context: ./apps/admin-web
      args:
        VITE_API_URL: https://back-rm.e-hotelmanager.com
    expose:
      - "8080"
    networks:
      - internal
      - coolify
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.hotel-admin.rule=Host(`admin-rm.e-hotelmanager.com`) || Host(`admin.hotelmanager.fr`)"
      - "traefik.http.routers.hotel-admin.entrypoints=https"
      - "traefik.http.routers.hotel-admin.tls=true"
      - "traefik.http.routers.hotel-admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.hotel-admin.loadbalancer.server.port=8080"

  # ──────────────────────────────────────────────────────────
  # User Web UI (Frontend)
  # Domains: rm-front.e-hotelmanager.com | hotel.hotelmanager.fr
  # ──────────────────────────────────────────────────────────
  hotel-rm-user-web:
    build:
      context: ./apps/user-web
      args:
        VITE_API_URL: https://back-rm.e-hotelmanager.com
    expose:
      - "8080"
    networks:
      - internal
      - coolify
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.hotel-user.rule=Host(`rm-front.e-hotelmanager.com`) || Host(`rm.e-hotelmanager.com`) || Host(`hotel.hotelmanager.fr`)"
      - "traefik.http.routers.hotel-user.entrypoints=https"
      - "traefik.http.routers.hotel-user.tls=true"
      - "traefik.http.routers.hotel-user.tls.certresolver=letsencrypt"
      - "traefik.http.services.hotel-user.loadbalancer.server.port=8080"

# ──────────────────────────────────────────────────────────
# Networks
# ──────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
  coolify:
    external: true
